name: Daily Auto Commit

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at 00:00 UTC
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Activity Log
        run: |
          echo "Automated commit on $(date)" >> activity.log

      - name: Commit and Push Changes
        run: |
          git config --global user.name "jayesh982"
          git config --global user.email "jayeshcheedella@gmail.com"

          git add activity.log

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily automated update [skip ci]"
            git push
          fi
